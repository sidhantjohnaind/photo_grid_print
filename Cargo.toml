[package]
name = "photo_grid_print"
version = "1.0.0"
edition = "2024"
authors = ["Antigravity"]
description = "Lightning-fast Grid Photo Sheet & PDF Generator with Real-Time Live Preview and Direct Print"
license = "MIT"
readme = "README.md"
repository = "https://github.com/your-username/photo_grid_print"
keywords = ["photo", "grid", "print", "pdf", "generator"]
categories = ["graphics", "command-line-utilities", "gui"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
eframe = "0.36.1"
image = "0.25.10"
lopdf = "0.44.0"
open = "5.4.3"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
walkdir = "2.5.0"
